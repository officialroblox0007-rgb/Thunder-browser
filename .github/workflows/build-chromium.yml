name: Build Thunder Browser (Chromium Cloud CI)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compile-chromium:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Fetch Chromium Source (~40min)
        run: |
          mkdir -p chromium && cd chromium
          fetch --no-history --nohooks chromium
          cd src
          ./build/install-build-deps.sh --no-prompt
          gclient runhooks

      - name: Write args.gn Configuration
        run: |
          cd chromium/src
          mkdir -p out/ThunderBrowser
          cat << 'EOF' > out/ThunderBrowser/args.gn
          # out/ThunderBrowser/args.gn
          # Generated by Chromium AI Studio for "Thunder Browser"
          
          target_cpu = "x64"
          is_debug = false
          symbol_level = 0
          blink_symbol_level = 0
          dcheck_always_on = false
          is_component_build = true
          
          # Media & Codec Flags
          proprietary_codecs = true
          ffmpeg_branding = "Chrome"
          
          # Branding & Binary Flags
          is_chrome_branded = false
          is_official_build = false
          enable_nacl = false
          
          EOF
          gn gen out/ThunderBrowser

      - name: Compile Custom Browser Binary with Autoninja
        run: |
          cd chromium/src
          autoninja -C out/ThunderBrowser chrome

      - name: Upload Browser Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThunderBrowser-Linux-x64
          path: chromium/src/out/ThunderBrowser/chrome
          
